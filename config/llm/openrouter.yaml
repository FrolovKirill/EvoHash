# @package _global_

# Universal OpenRouter config — pass model name via Hydra override:
#   llm=openrouter llm.models.0.model=qwen/qwen3.5-35b-a3b
#
# All requests go through the local fixup proxy (port 8100).
# Requires: python proxy/openrouter_proxy.py

llm:
  _target_: gigaevo.llm.models.MultiModelRouter
  _convert_: all
  models:
    - _target_: langchain_openai.ChatOpenAI
      model: openai/gpt-oss-120b
      api_key: ${oc.env:OPENAI_API_KEY}
      temperature: ${temperature}
      max_tokens: ${max_tokens}
      base_url: http://localhost:8100/api/v1
      request_timeout: ${request_timeout}
  probabilities: [1.0]
