# @package _global_

# Qwen 3.5 35B-A3B via OpenRouter (through local fixup proxy)
# https://openrouter.ai/qwen/qwen3.5-35b-a3b

llm:
  _target_: gigaevo.llm.models.MultiModelRouter
  _convert_: all
  models:
    - _target_: langchain_openai.ChatOpenAI
      model: qwen/qwen3.5-35b-a3b
      api_key: ${oc.env:OPENAI_API_KEY}
      temperature: ${temperature}
      max_tokens: ${max_tokens}
      base_url: http://localhost:8100/api/v1
      request_timeout: ${request_timeout}
  probabilities: [1.0]
