# Available LLM models for EvoHash evolution.
# This is the single source of truth — backend, frontend, and run_evohash.py
# all read from this file. To add a new model, just add an entry here.
#
# Fields:
#   key      — internal identifier (passed as --llm argument)
#   model_id — OpenRouter model path
#   label    — human-readable name shown in the UI

models:
  - key: openrouter_gpt_oss
    model_id: openai/gpt-oss-120b
    label: GPT-OSS 120B (OpenRouter)

  - key: openrouter_glm4_flash
    model_id: z-ai/glm-4.7-flash
    label: GLM-4.7 Flash (OpenRouter)

  - key: openrouter_qwen35_35b
    model_id: qwen/qwen3.5-35b-a3b
    label: Qwen 3.5 35B-A3B (OpenRouter)

  - key: openrouter_qwen35_122b
    model_id: qwen/qwen3.5-122b-a10b
    label: Qwen 3.5 122B-A10B (OpenRouter)
